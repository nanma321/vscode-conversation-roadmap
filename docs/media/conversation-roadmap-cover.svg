<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">Conversation Roadmap hackathon cover</title>
  <desc id="cover-description">A clean light cover showing a chat panel turning into a colorful branching roadmap. The headline reads Conversation Roadmap and the tagline reads Chats wander. Roadmaps remember.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0067c0"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chatBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#e1edff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16375b" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16375b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3378b8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8758b5"/>
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#c9d9eb"/>
    </pattern>
    <clipPath id="rightPanelClip">
      <rect x="825" y="138" width="655" height="636" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1420" cy="50" r="300" fill="#dff0ff" opacity="0.65"/>
  <circle cx="145" cy="820" r="250" fill="#efe7ff" opacity="0.7"/>
  <path d="M0 760 C260 690 420 845 690 760 C920 687 1080 705 1600 590 L1600 900 L0 900Z" fill="#f7fbff"/>

  <g transform="translate(96 86)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#brand)"/>
    <path d="M15 17h26v18H28l-7 7v-7h-6z" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="22" cy="26" r="2.2" fill="#ffffff"/>
    <circle cx="28" cy="26" r="2.2" fill="#ffffff"/>
    <circle cx="34" cy="26" r="2.2" fill="#ffffff"/>
    <text x="72" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#44617f">VS CODE + GITHUB COPILOT</text>
    <text x="72" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#617891">HACKATHON PROJECT</text>
  </g>

  <g transform="translate(96 218)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="760" letter-spacing="-2.5" fill="#172b43">Conversation</text>
    <text x="0" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="760" letter-spacing="-2.5" fill="#172b43">Roadmap</text>
    <rect x="0" y="116" width="118" height="8" rx="4" fill="url(#brand)"/>

    <text x="0" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" fill="#0067c0">Chats wander.</text>
    <text x="0" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" fill="#8758b5">Roadmaps remember.</text>

    <text x="0" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#526b84">
      <tspan x="0" dy="0">Turn supported AI conversations into a</tspan>
      <tspan x="0" dy="36">persistent, editable branching history.</tspan>
    </text>

    <g transform="translate(0 402)">
      <rect x="0" y="0" width="234" height="55" rx="27.5" fill="#172b43"/>
      <text x="117" y="35" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#ffffff">@roadmap → graph</text>
      <rect x="252" y="0" width="186" height="55" rx="27.5" fill="#ffffff" stroke="#9eb5ca" stroke-width="2"/>
      <text x="345" y="35" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#3d5874">Local-first</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="785" y="98" width="735" height="716" rx="38" fill="#ffffff" stroke="#d0dfed" stroke-width="2"/>
  </g>

  <g clip-path="url(#rightPanelClip)">
    <rect x="825" y="138" width="655" height="636" fill="url(#dots)"/>

    <g transform="translate(842 166)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="310" height="194" rx="20" fill="#ffffff" stroke="#c8d7e6" stroke-width="2"/>
      <rect x="0" y="0" width="310" height="43" rx="20" fill="#f5f8fc"/>
      <rect x="0" y="26" width="310" height="17" fill="#f5f8fc"/>
      <circle cx="24" cy="21" r="5" fill="#e26363"/>
      <circle cx="42" cy="21" r="5" fill="#e4b54d"/>
      <circle cx="60" cy="21" r="5" fill="#55b774"/>
      <text x="84" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#526b84">Copilot Chat</text>

      <rect x="18" y="61" width="194" height="42" rx="14" fill="url(#chatBubble)"/>
      <text x="32" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#0067c0">@roadmap</text>
      <text x="32" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#425c75">Compare auth options?</text>

      <rect x="64" y="116" width="228" height="57" rx="14" fill="#f3eefc"/>
      <text x="80" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" fill="#6b3fa0">Roadmap</text>
      <rect x="80" y="148" width="180" height="6" rx="3" fill="#b7a4d3"/>
      <rect x="80" y="160" width="137" height="6" rx="3" fill="#cec0e1"/>
    </g>

    <path d="M1128 262 C1205 262 1192 336 1264 336" fill="none" stroke="#3378b8" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <circle cx="1176" cy="290" r="22" fill="#ffffff" stroke="#3378b8" stroke-width="2"/>
    <path d="M1167 290h18M1176 281v18" stroke="#3378b8" stroke-width="2.5" stroke-linecap="round"/>

    <g filter="url(#cardShadow)">
      <rect x="1222" y="316" width="212" height="94" rx="16" fill="#2f80d0"/>
      <text x="1242" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Authentication</text>
      <rect x="1242" y="360" width="68" height="22" rx="11" fill="#1f5e9d"/>
      <text x="1276" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#ffffff">topic</text>
      <rect x="1317" y="360" width="76" height="22" rx="11" fill="#1f5e9d"/>
      <text x="1355" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#ffffff">in progress</text>
    </g>

    <path d="M1328 410 L1328 469" fill="none" stroke="#3378b8" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M1328 410 C1328 438 1118 440 1118 492" fill="none" stroke="#8758b5" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>

    <g filter="url(#cardShadow)">
      <rect x="1222" y="472" width="212" height="94" rx="16" fill="#e6ad31"/>
      <rect x="1362" y="461" width="50" height="22" rx="11" fill="#0067c0"/>
      <text x="1387" y="476" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">new</text>
      <text x="1242" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#172b43">JWT tradeoffs</text>
      <rect x="1242" y="516" width="76" height="22" rx="11" fill="#fff0c8"/>
      <text x="1280" y="531" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#5a430f">question</text>
      <rect x="1325" y="516" width="53" height="22" rx="11" fill="#fff0c8"/>
      <text x="1351.5" y="531" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#5a430f">open</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="1012" y="494" width="212" height="94" rx="16" fill="#9a70c2"/>
      <text x="1032" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Resume: OAuth</text>
      <rect x="1032" y="538" width="68" height="22" rx="11" fill="#704694"/>
      <text x="1066" y="553" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#ffffff">branch</text>
      <rect x="1107" y="538" width="53" height="22" rx="11" fill="#704694"/>
      <text x="1133.5" y="553" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#ffffff">open</text>
    </g>

    <path d="M1118 588 L1118 638" fill="none" stroke="#8758b5" stroke-width="4" marker-end="url(#arrow-purple)"/>

    <g filter="url(#cardShadow)">
      <rect x="1012" y="640" width="212" height="94" rx="16" fill="#49ae69"/>
      <text x="1032" y="669" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#102b18">OAuth outcome</text>
      <rect x="1032" y="684" width="72" height="22" rx="11" fill="#d8f3df"/>
      <text x="1068" y="699" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#194b27">outcome</text>
      <rect x="1111" y="684" width="51" height="22" rx="11" fill="#d8f3df"/>
      <text x="1136.5" y="699" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#194b27">done</text>
    </g>

    <g transform="translate(842 680)">
      <rect x="0" y="0" width="123" height="34" rx="17" fill="#ffffff" stroke="#b6c8d9" stroke-width="2"/>
      <circle cx="20" cy="17" r="6" fill="none" stroke="#526b84" stroke-width="2"/>
      <path d="M24 21l5 5" stroke="#526b84" stroke-width="2" stroke-linecap="round"/>
      <text x="39" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#526b84">Search</text>
    </g>
    <g transform="translate(850 728)">
      <rect x="0" y="0" width="76" height="28" rx="14" fill="#eef6ff" stroke="#9dbfe0"/>
      <text x="38" y="19" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#25659c">planning</text>
      <rect x="84" y="0" width="83" height="28" rx="14" fill="#f3eefc" stroke="#b9a4d2"/>
      <text x="125.5" y="19" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#704694">security</text>
    </g>
  </g>

  <g transform="translate(1230 806)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="#526b84">LOCAL-FIRST</text>
    <circle cx="118" cy="-5" r="4" fill="#9eb5ca"/>
    <text x="134" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="#526b84">EDITABLE</text>
    <circle cx="225" cy="-5" r="4" fill="#9eb5ca"/>
    <text x="241" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" fill="#526b84">TRACEABLE</text>
  </g>
</svg>
